apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-readme-activity-graph
  namespace: github-stats
  labels:
    app: github-readme-activity-graph
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: github-readme-activity-graph
  template:
    metadata:
      labels:
        app: github-readme-activity-graph
    spec:
      containers:
        - name: github-readme-activity-graph
          image: 192.168.2.26:32000/github-readme-activity-graph:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5100
          env:
            - name: PORT
              value: "5100"
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-stats-secret
                  key: TOKEN
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /
              port: 5100
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 5100
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 5100
            initialDelaySeconds: 5
            periodSeconds: 10
