# PLACEHOLDER SECRET — Krishna must inject the real GitHub PAT himself.
# This agent is not permitted to create, handle, paste, or transcribe GitHub
# tokens. See the final task report for the exact `kubectl create secret
# ... --dry-run=client -o yaml | kubectl apply -f -` command that replaces
# the placeholder value below with the real token, plus the
# `kubectl rollout restart` commands needed to pick it up.
#
# Keys:
#   PAT_1 - read by github-readme-stats (env PAT_1)
#   TOKEN - read by github-readme-activity-graph AND github-readme-streak-stats
#           (both env TOKEN; same underlying PAT can be reused for both, or
#           Krishna can point this key at a second token if he wants separate
#           GitHub API rate-limit budgets per service)
apiVersion: v1
kind: Secret
metadata:
  name: github-stats-secret
  namespace: github-stats
type: Opaque
stringData:
  PAT_1: "REPLACE_ME_PLACEHOLDER_NOT_A_REAL_TOKEN"
  TOKEN: "REPLACE_ME_PLACEHOLDER_NOT_A_REAL_TOKEN"
